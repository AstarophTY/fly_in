name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: flake8
        run: uvx flake8 *.py
      - name: mypy
        run: >
          uvx --with pydantic --with lark --with questionary mypy *.py
          --warn-return-any --warn-unused-ignores --ignore-missing-imports
          --disallow-untyped-defs --check-untyped-defs --follow-imports=silent

  maps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Solve every map (no 3D view)
        run: uv run --no-project --with pydantic --with lark python benchmark.py
